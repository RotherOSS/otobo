%YAML 1.1
---
name: 'DockerImageUpdateAutobuild'

# This workflow has been adapted from the workflow
# https://github.com/marketplace/actions/docker-image-update-checker#minimal

# This workflow checks whether there are updated base images and
# creates autobuild images on Docker Hub.
# The autobuild images can be tested and then released to the public.
# A Github issue is created automatically for each autobuild image.

on:

  # The trigger on 'workflow_dispatch' allows to start the workflow manually
  # via https://github.com/RotherOSS/otobo/actions/workflows/docker_image_update_autobuild.yml
  workflow_dispatch:

  # The trigger on 'schedule' declares that the workflow should run daily. The time is in UTC declared in cron syntax.
  # So '37 2 * * *' is daily at 2:37 UTC.
  # The scheduled jobs run only on the default branch.
  schedule:
    - cron: '37 2 * * *'

jobs:
  CheckDockerImageUpdate:
    runs-on: 'ubuntu-latest'

    # This long list is a workaround so that
    # the outputs from all matrix iterations can be collected.
    outputs:
      otobo_web_latest_10_0_autobuild: ${{ steps.collect_summary.outputs.otobo_web_latest_10_0_autobuild }}
      otobo_web_latest_10_1_autobuild: ${{ steps.collect_summary.outputs.otobo_web_latest_10_1_autobuild }}
      otobo_web_latest_11_0_autobuild: ${{ steps.collect_summary.outputs.otobo_web_latest_11_0_autobuild }}

      otobo_nginx_webproxy_latest_10_0_autobuild: ${{ steps.collect_summary.outputs.otobo_nginx_webproxy_latest_10_0_autobuild }}
      otobo_nginx_webproxy_latest_10_1_autobuild: ${{ steps.collect_summary.outputs.otobo_nginx_webproxy_latest_10_1_autobuild }}
      otobo_nginx_webproxy_latest_11_0_autobuild: ${{ steps.collect_summary.outputs.otobo_nginx_webproxy_latest_11_0_autobuild }}

      otobo_nginx_kerberos_webproxy_latest_10_0_autobuild: ${{ steps.collect_summary.outputs.otobo_nginx_kerberos_webproxy_latest_10_0_autobuild }}
      otobo_nginx_kerberos_webproxy_latest_10_1_autobuild: ${{ steps.collect_summary.outputs.otobo_nginx_kerberos_webproxy_latest_10_1_autobuild }}
      otobo_nginx_kerberos_webproxy_latest_11_0_autobuild: ${{ steps.collect_summary.outputs.otobo_nginx_kerberos_webproxy_latest_11_0_autobuild }}

    strategy:
      # create different images
      # note that there is no release build for the otobo-web-kerberos target
      # this currently has to be updated every release
      matrix:
        target: ['otobo-web', 'otobo-nginx-webproxy', 'otobo-nginx-kerberos-webproxy']
        docker_tag: [
          'latest-10_0-autobuild',
          'latest-10_1-autobuild',
          'latest-11_0-autobuild'
        ]
        include:
          # the latest release for every release branch - has to be updated
          -
            docker_tag: 'latest-10_0-autobuild'
            patch:      'rel-10_0_23'
          -
            docker_tag: 'latest-10_1-autobuild'
            patch:      'rel-10_1_13'
          -
            docker_tag: 'latest-11_0-autobuild'
            patch:      'rel-11_0_9'

          # otobo-web uses different base images in the different release branches
          -
            target:     'otobo-web'
            docker_tag: 'latest-10_0-autobuild'
            base_image: 'perl:5.32-buster'
          -
            target:     'otobo-web'
            docker_tag: 'latest-10_1-autobuild'
            base_image: 'perl:5.36-bookworm'
          -
            target:     'otobo-web'
            docker_tag: 'latest-11_0-autobuild'
            base_image: 'perl:5.38-bookworm'

          # otobo-nginx-kerberos-webproxy uses different dockerfiles in 10.0 and 10.1
          -
            target:     'otobo-nginx-kerberos-webproxy'
            docker_tag: 'latest-10_0-autobuild'
            dockerfile: 'otobo.nginx-kerberos.dockerfile'
          -
            target:     'otobo-nginx-kerberos-webproxy'
            docker_tag: 'latest-10_1-autobuild'
            dockerfile: 'otobo.nginx-kerberos.dockerfile'

          # common info for every target; for nginx this includes the base imagie
          -
            target:     'otobo-web'
            dockerfile: 'otobo.web.dockerfile'
            context:    '.'
            repository: 'rotheross/otobo'
          -
            target:     'otobo-nginx-webproxy'
            dockerfile: 'otobo.nginx.dockerfile'
            context:    'scripts/nginx'
            repository: 'rotheross/otobo-nginx-webproxy'
            base_image: 'nginx:mainline'
          -
            target:     'otobo-nginx-kerberos-webproxy'
            dockerfile: 'otobo.nginx.dockerfile'
            context:    'scripts/nginx'
            repository: 'rotheross/otobo-nginx-kerberos-webproxy'
            base_image: 'nginx:mainline'

    steps:

      -
        # These variables can be accessed in the env context
        name: Setting up the environment file (autobuild)
        run: |
          patch=${{ matrix.patch }}
          docker_tag=${{ matrix.docker_tag }}
          build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          (
            echo "otobo_branch=${patch}"
            echo "otobo_docker_tag=${docker_tag}"
            echo "otobo_ref=${{ matrix.repository }}:${docker_tag}"
            echo "otobo_base_image=${{ matrix.base_image }}"
            echo "otobo_build_date=${build_date}"
          ) >> $GITHUB_ENV

      -
        # this step sets ${{ steps.check.outputs.needs-updating }}
        name: Check whether the base image was updated
        id: check
        uses: lucacome/docker-image-update-checker@v2
        with:
          base-image: ${{ env.otobo_base_image }}
          image:      ${{ env.otobo_ref }}

      -
        # print the result in any case
        name: Report the check result
        id: collect_summary
        run: |
          output_key=${{ matrix.target }}_${{ matrix.docker_tag }}
          cleaned_output_key=$(echo $output_key | tr - _)
          echo "$cleaned_output_key=${{ steps.check.outputs.needs-updating }}" >> $GITHUB_OUTPUT

      - name: 'check out so that the composite action becomes available'
        if: ${{ steps.check.outputs.needs-updating == 'true' }}
        uses: actions/checkout@v4

      -
        # Use a local composite action.
        # The action uses the inputs and the env context.
        name: 'Run local composite action'
        if: ${{ steps.check.outputs.needs-updating == 'true' }}
        uses: ./.github/actions/docker_image_update
        with:
          fix_cldr: false
          dockerfile: matrix.dockerfile
          context: matrix.context
          target: ${{ matrix.target }}

  # Write Summary
  WriteSummary:
    needs: CheckDockerImageUpdate
    runs-on: 'ubuntu-latest'
    steps:
      -
        name: Write a summary
        id: write_summary
        run: |
          cat <<END_JSON >> $GITHUB_STEP_SUMMARY
          ${{ toJSON(needs.CheckDockerImageUpdate.outputs) }}
          END_JSON

  # create an issue that reminds people that manual action must be performed
  CreateIssue:
    needs: CheckDockerImageUpdate
    runs-on: 'ubuntu-latest'
    steps:
      -
        name: Count number of builds
        id: count_builds
        # might work if there are no single quotes on the JSON
        run: |
          num_builds=$(jq '[.[] | select(contains("true"))] | length' <<END_JSON
          ${{ toJSON(needs.CheckDockerImageUpdate.outputs) }}
          END_JSON
          )
          echo "number of builds is $num_builds" >> $GITHUB_STEP_SUMMARY
          echo "num_builds=$num_builds" >> $GITHUB_OUTPUT
      -
        name: Create an issue
        id: create_issue
        if: steps.count_builds.outputs.num_builds >= 1
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Issue create by docker_image_updater_autobuild.yml',
              body: `
                The workflow docker_image_update_autobuild has run.
                There is work to do. Test the newly created Docker images.
                They should be available on Docker Hub.
                Release the images when things look fine.
                ${{ needs.CheckDockerImageUpdate.outputs.summary }}`,
              labels: [ 'Action DockerImageUpdateAutobuild' ]
            })
