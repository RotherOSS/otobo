# Headers that nginx passes to the OTOBO web application.
#
# Include this snippet in EVERY location that proxies to OTOBO. nginx does not inherit
# proxy_set_header directives from the server block once a location defines its own,
# so a location without this include would forward client supplied headers unchanged.

# Information about the original client. OTOBO only believes these headers when the
# request carries the correct WebServer::ProxySecret (the X-OTOBO-Proxy-Secret header set below).
proxy_set_header X-Forwarded-Host   $host:$server_port;
proxy_set_header X-Forwarded-Server $host;
proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto  $scheme;

# Never forward a client supplied identity. An empty value removes the header.
# With the default "underscores_in_headers off" nginx already drops the spellings
# REMOTE_USER and Remote_User from clients; Remote-User must be removed explicitly.
# Locations that perform SSO add their own "proxy_set_header REMOTE_USER $remote_user"
# after this include; that header is named differently and is not affected.
proxy_set_header Remote-User "";
