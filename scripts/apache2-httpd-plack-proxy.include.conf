# sample apache config file as reverse proxy against otobo.psgi
# --

# The idea is that a web server is started on the host machine.
# Apache then acts as a proxy and forwards its request to the web server.

# mod_proxy is already available in Apache 2.4.
# In addition to mod_proxy, the module mod_proxy_http must be enabled:
#   sudo a2enmod proxy_http

# Start the webserver serving /otobo
#  plackup --server Gazelle --port 5000 --daemonize --nproc 10 /opt/otobo/bin/psgi-bin/otobo.psgi
# Or use the webserver running under Docker.

# Then link to this file from /etc/apache2/sites-enables/zzz_otobo.conf.
#   (cd /etc/apache2/sites-enabled && sudo ln -sf /opt/otobo/scripts/apache2-httpd-plack-proxy.include.conf zzz_otobo.conf)

# And then restart the webserver.
#   sudo systemctl restart apache2.service

Alias /otobo-web/ "/opt/otobo/var/httpd/htdocs/"

# Apache acts as a reverse proxy here, so the PSGI variable REMOTE_USER can not reach OTOBO.
# 1. Always remove any client supplied identity header.
# 2. If Apache performs SSO for this virtual host, forward the authenticated user in the
#    "Remote-User" header AND prove the proxy identity with the shared secret. In OTOBO set
#    'AuthModule::HTTPBasicAuth::TrustProxyHeader' = 1 and 'WebServer::ProxySecret' to the
#    same value used below (or the environment variable OTOBO_PROXY_SECRET).
<IfModule mod_headers.c>
    RequestHeader unset Remote-User early
    #RequestHeader set Remote-User          "%{REMOTE_USER}s"
    #RequestHeader set X-OTOBO-Proxy-Secret "replace me with a long random string"
</IfModule>

# If this virtual host performs SSO, the GenericInterface must be excluded from it, because
# API clients can not perform interactive SSO. Wrap the SSO directives in a <LocationMatch>
# that excludes nph-genericinterface.pl, or add a dedicated <Location> without auth, e.g.:
#
#<Location "/otobo/nph-genericinterface.pl">
#    <IfModule mod_headers.c>
#        RequestHeader unset Remote-User early
#        #RequestHeader set X-OTOBO-Proxy-Secret "replace me with a long random string"
#    </IfModule>
#    # no Require valid-user / auth here
#</Location>

ProxyPass        "/otobo/" "http://localhost:5000/otobo/" retry=0 timeout=10
ProxyPassReverse "/otobo/" "http://localhost:5000/otobo/"

# the static content
<Directory "/opt/otobo/var/httpd/htdocs/">
    AllowOverride None

    # Require supported starting with Apache 2.4
    # No authentication and all requests are allowed.
    Require all granted

    <IfModule mod_filter.c>
        <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/javascript application/javascript text/css text/xml application/json text/json
         </IfModule>
    </IfModule>

    # Make sure CSS and JS files are read as UTF8 by the browsers.
    AddCharset UTF-8 .css
    AddCharset UTF-8 .js

    # Set explicit mime type for woff fonts since it is relatively new and apache may not know about it.
    AddType application/font-woff .woff
</Directory>

<IfModule mod_headers.c>
    # Cache css-cache for 30 days
    <Directory "/opt/otobo/var/httpd/htdocs/skins/*/*/css-cache">
        <FilesMatch "\.(css|CSS)$">
            Header set Cache-Control "max-age=2592000 must-revalidate"
        </FilesMatch>
    </Directory>

    # Cache css thirdparty for 4 hours, including icon fonts
    <Directory "/opt/otobo/var/httpd/htdocs/skins/*/*/css/thirdparty">
        <FilesMatch "\.(css|CSS|woff|svg)$">
            Header set Cache-Control "max-age=14400 must-revalidate"
        </FilesMatch>
    </Directory>

    # Cache js-cache for 30 days
    <Directory "/opt/otobo/var/httpd/htdocs/js/js-cache">
        <FilesMatch "\.(js|JS)$">
            Header set Cache-Control "max-age=2592000 must-revalidate"
        </FilesMatch>
    </Directory>

    # Cache js thirdparty for 4 hours
    <Directory "/opt/otobo/var/httpd/htdocs/js/thirdparty/">
        <FilesMatch "\.(js|JS)$">
            Header set Cache-Control "max-age=14400 must-revalidate"
        </FilesMatch>
    </Directory>
</IfModule>

# Limit the number of requests per child to avoid excessive memory usage.
# 1000 is the same value as the default value used by Gazelle.
MaxConnectionsPerChild 1000
